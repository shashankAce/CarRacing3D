                        "surface": "#131313",
                        "on-secondary-container": "#9bbea0",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Modal Shadow mimicking 3D environment depth */
        .modal-shadow {
            box-shadow: 0 16px 32px rgba(27, 48, 34, 0.4), 0 4px 8px rgba(0, 0, 0, 0.5);
        }
        
        /* Physical Button Effects */
        .btn-primary {
            border-bottom-width: 4px;
            border-color: #c96b00; /* Darker sunset orange */
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
        
        .btn-primary:active {
            transform: translateY(4px);
            border-bottom-width: 0px;
            margin-bottom: 4px;
        }

        .btn-secondary {
            border-bottom-width: 4px;
            border-color: #1a3321; /* Darker forest green */
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        
        .btn-secondary:active {
            transform: translateY(4px);
            border-bottom-width: 0px;
            margin-bottom: 4px;
        }
        
        /* Glassmorphism Surface for Modal */
        .glass-surface {
            background: linear-gradient(180deg, rgba(42, 42, 42, 0.85) 0%, rgba(19, 19, 19, 0.95) 100%);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(135, 171, 229, 0.15); /* Muted blue border accent */
        }
    </style>
</head>
<body class="bg-background text-on-surface w-full h-screen overflow-hidden flex items-center justify-center relative">
<!-- Gameplay Background Simulation -->
<div class="absolute inset-0 z-0 bg-cover bg-center bg-no-repeat" data-alt="A cinematic, low-poly 3D racing game environment showing a high-speed vehicle on a canyon track at sunset. The scene uses deep blacks, warm sunset orange, and muted blues. The lighting is dramatic and atmospheric, characteristic of modern mobile arcade racers." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuADuBAkPd5h0mtY24buAZ4oYo_0sF93c8pyXy1uNesxFhASKcdUpb5EKwH4cCc325VnvqJJOamrBBRIAlI9qUnvOE2nE20PnAA7pOOOm7iJTxRes6pCdQkvSVeYv9yOEx8FkYR4D1OrBIOP2PjE5Op7ftQUYLd1CNTWIKUMODP8CcRvWBmN8r3fCXbNn87NQMdoxHUghP3aMuKm4hwT_fkXcjHMbHNnvWOfHX2WRsrzIRa63m-LRwxneg')">
<!-- HUD Elements (Blurred out by overlay) -->
<div class="absolute top-0 left-0 w-full px-hud-padding pt-safe-margin flex justify-between opacity-30">
<div class="w-16 h-16 rounded-full border-4 border-surface-variant flex items-center justify-center">
<span class="text-stat-number font-stat-number">84</span>
</div>
<div class="flex flex-col items-end">
<span class="text-label-caps font-label-caps text-on-surface-variant">SCORE</span>
<span class="text-headline-lg-mobile font-headline-lg-mobile">12,450</span>
</div>
</div>
</div>
<!-- Blur Overlay -->
<div class="absolute inset-0 z-10 bg-surface/60 backdrop-blur-md"></div>
<!-- Center-Anchored Modal -->
<main class="z-20 w-full max-w-[400px] px-[48px] flex flex-col items-center">
<!-- Pause Panel -->
<div class="glass-surface modal-shadow rounded-xl w-full p-6 flex flex-col items-center">
<!-- Header -->
<div class="mb-8 flex flex-col items-center">
<span class="material-symbols-outlined text-[48px] text-on-surface-variant mb-2">pause_circle</span>
<h1 class="text-headline-lg-mobile font-headline-lg-mobile tracking-wider text-on-surface">PAUSED</h1>
</div>
<!-- Action Stack -->
<div class="flex flex-col w-full space-y-4">
<!-- Resume Button (Primary) -->
<button class="btn-primary w-full bg-primary-container text-[#111111] rounded-lg py-4 px-6 flex justify-center items-center gap-2 transition-transform duration-100 hover:brightness-110">
<span class="material-symbols-outlined text-[20px]">play_arrow</span>
<span class="text-label-caps font-label-caps text-sm">RESUME</span>
</button>
<!-- Restart Button (Secondary) -->
<button class="btn-secondary w-full bg-secondary-container text-on-surface rounded-lg py-4 px-6 flex justify-center items-center gap-2 transition-transform duration-100 hover:brightness-110">
<span class="material-symbols-outlined text-[20px]">refresh</span>
<span class="text-label-caps font-label-caps text-sm">RESTART</span>
</button>
<!-- Settings Button (Secondary) -->
<button class="btn-secondary w-full bg-surface-variant text-on-surface rounded-lg py-4 px-6 flex justify-center items-center gap-2 transition-transform duration-100 hover:brightness-110 border-b-[#1f1f1f]">
<span class="material-symbols-outlined text-[20px]">settings</span>
<span class="text-label-caps font-label-caps text-sm">SETTINGS</span>
</button>
</div>
<!-- Main Menu Text Link -->
<div class="mt-8">
<a class="text-label-caps font-label-caps text-on-surface-variant hover:text-primary transition-colors flex items-center gap-2 group" href="#">
<span class="material-symbols-outlined text-[16px] group-hover:-translate-x-1 transition-transform">logout</span>
                    MAIN MENU
                </a>
</div>
</div>
</main>

        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', () => {
                // Simulate physical press logic if needed beyond CSS
            });
        });
    </script>
</body></html>
